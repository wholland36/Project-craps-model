name: Project Craps forecast engine safety tests
on:
  push:
    paths:
      - 'models/market_engine.py'
      - 'models/run_pregame.py'
      - 'tests/test_market_engine.py'
      - '.github/workflows/forecast-safety-tests.yml'
  pull_request:
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v

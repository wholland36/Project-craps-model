name: NFL and NCAA FBS chronological research
on:
  workflow_dispatch:
  push:
    paths:
      - 'models/train_football.py'
      - 'tests/test_football_research.py'
      - '.github/workflows/football-research.yml'
jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        sport: [NFL, NCAAF]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scikit-learn requests
      - run: python -m unittest discover -s tests -v
      - run: python -m models.train_football --sport ${{ matrix.sport }} --output results/${{ matrix.sport }}_research.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: football-${{ matrix.sport }}-research
          path: results/
          if-no-files-found: warn

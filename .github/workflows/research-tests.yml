name: Research pipeline tests
on:
  pull_request:
  push:
    paths:
      - 'project_craps/**'
      - 'research/**'
      - 'models/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'VALIDATION_RULES.md'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements-research.txt
      - run: python -m unittest discover -s tests -v
